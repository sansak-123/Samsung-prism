# Samsung PRISM 26VI05 - VLM image evaluation pipeline (English only)
project_seed: 2026

paths:
  data_dir: data
  images_dir: data/images
  metadata_dir: data/metadata
  pairs_dir: data/pairs
  pilot_dir: pilot
  outputs_dir: outputs          # checkpoints / adapters
  predictions_dir: predictions
  reports_dir: reports

dataset:                        # the dataset is the "24 generation" ladder below (scripts/01_generate_dataset.py)
  language: en
  templates: [invoice, receipt, certificate, application_form, business_letter, restaurant_menu, event_flyer, mobile_settings,
              bank_statement, payslip, boarding_pass, medical_prescription, resume, newsletter, nutrition_label, id_card,
              shipping_label, report_card, utility_bill, email_message, web_landing_page, chat_screenshot, presentation_slide]
  workers: 0                    # 0 = all CPU cores

sampling:                       # whole-document target scores (severity = 1 - score); only the renderer self-test uses these
  p_clean_release: 0.08         # release with only minute changes everywhere
  focus_beta_a: 2.0             # focus-category severity ~ Beta(2.0, 2.6)  (mean ~0.43)
  focus_beta_b: 2.6
  minute_beta_a: 1.1            # off-focus "minute" severity ~ Beta(1.1, 14) (mean ~0.07)
  minute_beta_b: 14.0
  p_untouched_metric: 0.30      # chance an off-focus metric is exactly unchanged
  p_extra_defect: 0.20          # chance of one extra moderate off-focus defect

ladder:                         # THE dataset (prism/ladder.py): per Original 1 control + edit families x 4 levels
  n_originals: 300              # spread over all 23 dataset.templates (13 each, the first template 14)
                                # scores are MEASURED by the renderer during generation (no manual labels)
  # the prism_iqa "24 generation": 6 families x 4 levels -> 1 + 24 releases per Original (300 x 25 = 7,500 pairs).
  # optional extra families (11 of the 12 metrics get their own ladder with all 13 -> 1 + 52 releases):
  #   char_substitution, ghost_residue, texture_smoothing, lighting_drop, local_compression, object_shift, heading_shift
  knobs: [font_family, font_size, font_color, inpaint_color_mismatch, justification, line_spacing]
  max_conflicts: 0              # 0 = the edited block must never run into other text/objects/rules

pilot:
  levels: [0.05, 0.15, 0.30, 0.50, 0.75]   # 5 images per artifact type (12 metrics -> 60 pairs)

splits:
  train: 0.70
  val: 0.15
  test: 0.15                    # grouped by sample_id, stratified by template -> no leakage
  holdout_templates: []         # e.g. [newsletter, id_card, chat_screenshot]: ALL their samples go to test
                                # (never seen in training) -> measures generalisation to unseen document types

model:
  # Scale the judge with the hardware - the data, training and evaluation code are identical:
  #   Qwen/Qwen2.5-VL-3B-Instruct   free Kaggle/Colab T4 (16 GB), fp16           <- default
  #   Qwen/Qwen2.5-VL-7B-Instruct   L4 / A10 (24 GB) or A100, bf16, 4-bit QLoRA  -> markedly stronger fine detail
  #   Qwen/Qwen2.5-VL-32B-Instruct  A100 80 GB / H100, 4-bit QLoRA                -> strongest
  base: Qwen/Qwen2.5-VL-3B-Instruct
  min_pixels: 200704            # 256 * 28 * 28
  max_pixels: 802816            # 1024 * 28 * 28 -> ~1000 visual tokens per 768x1024 image
  max_seq_len: 4096             # sequences are NEVER truncated; longer ones abort with an error

qlora:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

train:
  epochs: 3
  per_device_batch_size: 1
  grad_accum: 16
  learning_rate: 1.0e-4         # deck listed 1-2e-5; for LoRA adapters 1e-4 is the usual working range
  lr_scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  evals_per_epoch: 2
  val_loss_subset: 120          # pairs used for eval_loss
  val_generation_subset: 32     # pairs generated + scored at each eval -> checkpoint selection by val MAE
  gradient_checkpointing: true
  save_total_limit: 3

inference:
  batch_size: 4
  max_new_tokens: 768
  retry_max_new_tokens: 256
  prompt_study_n: 60            # val pairs used to compare P1-P4 zero-shot
  test_limit: 0                 # 0 = full test split

scoring:
  category_weights: {technical: 1.0, visual: 1.0, human_perception: 1.0}

evaluation:
  top_error_threshold: 0.30
  gate_threshold: 0.95          # quality gate: a release is rejected when any metric is below this
